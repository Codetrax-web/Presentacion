<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Damian Cruz - CodeTrax</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #121212; font-family: sans-serif; color: white; }
        .card { background: rgba(20, 20, 30, 0.4); padding: 30px; border-radius: 25px; text-align: center; border: 1px solid rgba(255, 255, 255, 0.1); width: 300px; }
        .socials { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin: 20px 0; }
        .socials a {
            position: relative; background: #212121; color: white; padding: 20px; border-radius: 15px; text-decoration: none; font-size: 1.5rem; overflow: hidden; transition: 0.5s; display: flex; justify-content: center; align-items: center; z-index: 1; border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .socials a .blob1, .socials a .blob2 { position: absolute; width: 100%; height: 100%; background: linear-gradient(45deg, #793eeb, #4a19a9); filter: blur(15px); opacity: 0; transition: 0.5s; z-index: -1; }
        .socials a:hover .blob1, .socials a:hover .blob2 { opacity: 1; }
        .socials a:hover { transform: scale(1.05); border-color: transparent; }
        .extra-info { max-height: 0; overflow: hidden; transition: 0.5s; margin-top: 10px; }
        .extra-info.visible { max-height: 100px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>DAMIAN CRUZ</h1>
        <div class="socials">
            <a href="#"><div class="blob1"></div><div class="blob2"></div><i class="fab fa-instagram"></i></a>
            <a href="#"><div class="blob1"></div><div class="blob2"></div><i class="fab fa-whatsapp"></i></a>
            <a href="#"><div class="blob1"></div><div class="blob2"></div><i class="fas fa-globe"></i></a>
            <a href="#"><div class="blob1"></div><div class="blob2"></div><i class="fab fa-discord"></i></a>
            <a href="#"><div class="blob1"></div><div class="blob2"></div><i class="fab fa-github"></i></a>
            <a href="#"><div class="blob1"></div><div class="blob2"></div><i class="fab fa-youtube"></i></a>
        </div>
        <button class="toggle-btn">Mostrar Más</button>
        <div class="extra-info">Datos de contacto aquí.</div>
    </div>
    <script src="anim.js"></script>
</body>
</html>
