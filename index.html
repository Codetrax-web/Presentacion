<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Damian Cruz - CodeTrax</title>
    <link rel="icon" type="image/webp" href="Ima/logo.webp">
    
    <!-- Importación de la fuente Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>
    /* =========================================================
       ESTILO: NEGRO OBSIDIANA GLASS (GLASSMORPHISM PURO)
       ========================================================= */
    :root {
        /* Paleta Obsidiana Glass */
        --obsidiana-gradiente: linear-gradient(135deg, rgba(25, 25, 32, 0.85) 0%, rgba(8, 8, 12, 0.92) 100%);
        --obsidiana-panel: rgba(12, 12, 16, 0.7);
        
        --blanco-plata: #e2e8f0;
        --blanco-puro: #ffffff;
        --border-glass-bright: rgba(255, 255, 255, 0.18);
        --border-glass-subtle: rgba(255, 255, 255, 0.08);

        /* Acentos */
        --azul-rey: #1d4ed8;
        --azul-rey-glow: rgba(29, 78, 216, 0.8);

        --rojo-carmin: #c8102e;
        --rojo-carmin-hover-bg: rgba(200, 16, 46, 0.3);
        --rojo-carmin-glow: rgba(200, 16, 46, 0.75);
    }

    body {
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        
        background: url('Ima/fondo.webp') no-repeat center center fixed;
        background-size: cover;
        font-family: 'Poppins', sans-serif;
        color: var(--blanco-puro);
        overflow-x: hidden;
    }

    .card-container {
        width: 90%;
        max-width: 380px;
        perspective: 1000px;
        padding: 50px 0;
    }

    /* Tarjeta Principal en Negro Obsidiana Glass */
    .card {
        background: var(--obsidiana-gradiente);
        backdrop-filter: blur(25px) saturate(200%);
        -webkit-backdrop-filter: blur(25px) saturate(200%);
        border-radius: 25px;
        border: 1px solid var(--border-glass-bright);
        box-shadow: 
            0 20px 50px rgba(0, 0, 0, 0.9),
            inset 0 1px 1px rgba(255, 255, 255, 0.2); /* Reflejo superior estilo cristal */
        padding: 30px;
        text-align: center;
        transition: all 0.5s ease;
    }

    /* Foto de perfil con aro Azul Rey */
    .profile-pic {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        border: 4px solid var(--azul-rey);
        box-shadow: 0 0 25px var(--azul-rey-glow);
        object-fit: cover;
        margin-top: -80px;
        margin-bottom: 20px;
        transition: all 0.3s ease;
    }

    h1 { 
        font-size: 1.8rem; 
        margin: 0; 
        color: var(--blanco-puro); 
        font-weight: 600; 
        letter-spacing: 0.5px;
        text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }

    .title { 
        font-weight: 600; 
        font-size: 0.95rem; 
        margin-bottom: 30px; 
        color: var(--azul-rey); 
        text-transform: uppercase; 
        letter-spacing: 2px;
    }

    .socials { 
        display: grid; 
        grid-template-columns: repeat(3, 1fr); 
        gap: 15px; 
        margin-bottom: 30px; 
    }

    /* Botones de Redes Sociales en Cristal Oscuro */
    .socials a {
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        color: var(--blanco-plata);
        padding: 18px;
        border-radius: 15px;
        text-decoration: none;
        font-size: 1.5rem;
        transition: all 0.3s ease;
        border: 1px solid var(--border-glass-subtle);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }

    /* Hover Rojo Carmín con Neón */
    .socials a:hover {
        color: var(--blanco-puro);
        background: var(--rojo-carmin-hover-bg);
        box-shadow: 0 8px 25px var(--rojo-carmin-glow), inset 0 1px 0 rgba(255, 255, 255, 0.3);
        border: 1px solid var(--rojo-carmin);
        transform: translateY(-3px);
    }

    /* Botón Desplegable de Contacto */
    .details-btn {
        background: rgba(255, 255, 255, 0.04);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        color: var(--blanco-puro);
        border: 1px solid var(--border-glass-subtle);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1);
        padding: 15px 25px;
        border-radius: 15px;
        cursor: pointer;
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-family: 'Poppins', sans-serif;
        font-size: 1rem;
        transition: all 0.3s ease;
    }
    
    .details-btn:hover {
        background: var(--rojo-carmin-hover-bg);
        border-color: var(--rojo-carmin);
        box-shadow: 0 5px 20px var(--rojo-carmin-glow);
    }

    /* Contenedor Desplegable en Obsidiana Oscura */
    .contact-info {
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.5s ease-out, padding 0.5s ease;
        background: var(--obsidiana-panel);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        border: 1px solid var(--border-glass-subtle);
        border-radius: 15px;
        margin-top: 10px;
    }

    .contact-info.visible { 
        max-height: 200px; 
        padding: 15px; 
        margin-top: 15px; 
    }
    
    .contact-item { 
        margin: 12px 0; 
        display: flex; 
        align-items: center; 
    }

    .contact-item i { 
        color: var(--azul-rey); 
        margin-right: 12px; 
    }
    
    .contact-item a {
        color: var(--blanco-plata);
        text-decoration: none;
        transition: color 0.3s ease;
    }
    
    .contact-item a:hover {
        color: var(--blanco-puro);
    }
    
    #arrow {
        transition: transform 0.3s ease;
    }

</style>
</head>
<body>
    <div class="card-container">
        <div class="card">
            <img src="Ima/tu.webp" alt="Damian Cruz - CODETRAX" class="profile-pic">
            <h1>DAMIAN CRUZ</h1>
            <p class="title">FUNDADOR | CODETRAX</p>
            
            <div class="socials">
                <a href="https://www.instagram.com/damia_ncv" target="_blank" rel="noopener noreferrer" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
                <a href="https://www.tiktok.com/@damian_cdx" target="_blank" rel="noopener noreferrer" aria-label="TikTok"><i class="fab fa-tiktok"></i></a>
                <a href="https://codetrax.s.gy/" target="_blank" rel="noopener noreferrer" aria-label="Sitio Web CODETRAX"><i class="fas fa-globe"></i></a>
                <a href="https://discord.gg/uUSeyPxzgX" target="_blank" rel="noopener noreferrer" aria-label="Discord"><i class="fab fa-discord"></i></a>
                <a href="https://github.com/Codetrax-web" target="_blank" rel="noopener noreferrer" aria-label="GitHub"><i class="fab fa-github"></i></a>
                <a href="https://www.youtube.com/@DAMIANCDX" target="_blank" rel="noopener noreferrer" aria-label="YouTube"><i class="fab fa-youtube"></i></a>
            </div>
            
            <button class="details-btn" id="toggle-details">
                Datos de Contacto <i class="fas fa-chevron-down" id="arrow"></i>
            </button>
            
            <div class="contact-info" id="contact-panel">
                <div class="contact-item">
                    <i class="fas fa-phone"></i> 
                    <a href="tel:+525578526705">+52 5578526705</a>
                </div>
                <div class="contact-item">
                    <i class="fas fa-envelope"></i> 
                    <a href="mailto:damiancdx@gmail.com">damiancdx@gmail.com</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const toggleBtn = document.getElementById('toggle-details');
        const contactPanel = document.getElementById('contact-panel');
        const arrowIcon = document.getElementById('arrow');
        
        toggleBtn.addEventListener('click', () => {
            contactPanel.classList.toggle('visible');
            arrowIcon.style.transform = contactPanel.classList.contains('visible') ? 'rotate(180deg)' : 'rotate(0deg)';
        });
    </script>
</body>
</html>
